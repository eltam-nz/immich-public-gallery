# Portainer stack: Stacks → Add stack → Repository (compose path: docker-compose.yml),
# then set the variables from .env.example under "Environment variables".
#
# Tunnel modes (see README):
#   - Bundled tunnel: set COMPOSE_PROFILES=bundled-tunnel and TUNNEL_TOKEN.
#   - Shared tunnel:  add docker-compose.shared-tunnel.yml as an additional compose file
#                     and set TUNNEL_NETWORK; leave COMPOSE_PROFILES and TUNNEL_TOKEN unset.
name: immich-showcase

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: showcase
      POSTGRES_USER: showcase_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
    volumes:
      - ${DATA_DIR:-/srv/docker/immich-showcase}/postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showcase_owner -d showcase"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the least-privilege role and applies migrations, then exits.
  # One-shot: makes the cache and backup folders writable by uid 1000 (public-api,
  # backup). Docker creates missing bind-mount folders as root.
  init-dirs:
    image: postgres:16-alpine  # reused only for its shell; already pulled for db
    restart: "no"
    user: root
    network_mode: none
    entrypoint: ["sh", "-c", "chown 1000:1000 /cache /backups && chmod 755 /cache /backups"]
    volumes:
      - ${DATA_DIR:-/srv/docker/immich-showcase}/cache:/cache
      - ${BACKUP_DIR:-${DATA_DIR:-/srv/docker/immich-showcase}/backups}:/backups

  migrate:
    build: { context: ., dockerfile: db/Dockerfile }
    restart: "no"
    environment:
      PGHOST: db
      PGDATABASE: showcase
      PGUSER: showcase_owner
      PGPASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      PUBLIC_DB_PASSWORD: ${PUBLIC_DB_PASSWORD:?set PUBLIC_DB_PASSWORD}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set ADMIN_DB_PASSWORD}
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }

  public-api:
    <<: *hardening
    build: { context: ., dockerfile: apps/public-api/Dockerfile }
    environment:
      DATABASE_URL: postgres://showcase_public:${PUBLIC_DB_PASSWORD}@db:5432/showcase
      IMMICH_URL: ${IMMICH_URL:-http://immich_server:2283}
      SHARED_LINK_KEYS: ${SHARED_LINK_KEYS:-}
      PUBLIC_ID_SECRET: ${PUBLIC_ID_SECRET:?set PUBLIC_ID_SECRET}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      VIDEO_THREADS: ${VIDEO_THREADS:-2}
      SITE_TITLE: ${SITE_TITLE:-Photos}
      CACHE_DIR: /cache
    volumes:
      - ${DATA_DIR:-/srv/docker/immich-showcase}/cache:/cache
    tmpfs: [/tmp]
    networks: [backend, immich]
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-dirs: { condition: service_completed_successfully }

  public-web:
    <<: *hardening
    build: { context: ., dockerfile: apps/public-web/Dockerfile }
    tmpfs: [/tmp]
    networks: [edge, backend]
    depends_on: [public-api]

  # Database backups: a verified pg_dump every BACKUP_INTERVAL_HOURS, keeping the
  # newest BACKUP_KEEP. Make one now: docker exec <container> backup.sh once
  backup:
    <<: *hardening
    build: { context: ., dockerfile: db/Dockerfile }
    entrypoint: ["/usr/local/bin/backup.sh"]
    user: "1000:1000"
    environment:
      PGHOST: db
      PGDATABASE: showcase
      PGUSER: showcase_owner
      PGPASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ${BACKUP_DIR:-${DATA_DIR:-/srv/docker/immich-showcase}/backups}:/backups
    tmpfs: [/tmp]
    networks: [backend]
    healthcheck:
      test: ["CMD", "/usr/local/bin/backup.sh", "check"]
      interval: 5m
      timeout: 10s
      start_period: 10m
    depends_on:
      migrate: { condition: service_completed_successfully }
      init-dirs: { condition: service_completed_successfully }

  # Private admin app. Requires Cloudflare Access in front of its hostname, and
  # verifies the Access token itself: without CF_ACCESS_* and ADMIN_EMAILS it
  # refuses to start (fails closed).
  admin-app:
    <<: *hardening
    build: { context: ., dockerfile: apps/admin-app/Dockerfile }
    environment:
      DATABASE_URL: postgres://showcase_admin:${ADMIN_DB_PASSWORD}@db:5432/showcase
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      VIDEO_WARN_MB: ${VIDEO_WARN_MB:-500}
      CACHE_DIR: /cache
    volumes:
      - ${DATA_DIR:-/srv/docker/immich-showcase}/cache:/cache:ro
    tmpfs: [/tmp]
    # egress: fetches Cloudflare Access signing keys.
    networks: [edge, backend, egress]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Bundled tunnel. Only starts with COMPOSE_PROFILES=bundled-tunnel.
  cloudflared:
    <<: *hardening
    profiles: [bundled-tunnel]
    image: cloudflare/cloudflared:2025.4.0
    command: tunnel --no-autoupdate run
    environment:
      # Not ":?" because Compose validates required variables even for inactive profiles.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [edge, egress]
    depends_on: [public-web]

networks:
  # cloudflared <-> public-web and admin-app. No internet access.
  edge:
    internal: true
  # Outbound internet: the bundled cloudflared, and the admin app (Access signing keys).
  egress: {}
  # db, migrate, public-api, public-web. No internet access.
  backend:
    internal: true
  # Your existing Immich stack's network, so public-api can reach immich_server.
  immich:
    external: true
    name: ${IMMICH_NETWORK:-immich_default}
